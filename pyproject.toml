[project]
name = "running_page"
version = "3.0.0"
description = "Geng Niu's Personal Running Dashboard"
authors = [{ name = "Geng Niu" }]
dependencies = [
  "httpx",
  "gpxpy==1.6.2",
  "appdirs>=1.4.0",
  "s2sphere",
  "arrow",
  "geopy",
  "polyline",
  "sqlalchemy",
  "tzfpy; platform_system != \"Windows\"",
  "timezonefinder; platform_system == \"Windows\"",
  "pyyaml",
  "tcxreader",
  "rich",
  "lxml",
  "eviltransform",
  "numpy",
  "tzlocal",
  "fit-tool",
  "garmin-fit-sdk",
  "haversine==2.8.0",
  "certifi==2025.1.31",
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true
packages = ["run_page"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
